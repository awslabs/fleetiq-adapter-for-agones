---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gamelift-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: gamelift-daemonset
  template:
    metadata:
      labels:
        name: gamelift-daemonset
    spec:
      tolerations:
        - operator: Exists
      containers:
      - name: gamelift-daemonset
        # Replace with the image you built and pushed to your own registry.
        image: <YOUR_REGISTRY>/gamelift-daemon:<TAG>
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: "PYTHONUNBUFFERED"
            value: "1"
          - name: "PYTHONIOENCODING"
            value: "UTF-8"
          - name: "AWS_REGION"
            value: "us-west-2"
          - name: "GAME_SERVER_GROUP_NAME"
            value: "agones-game-servers"
          - name: "REDIS_URL"
            # Replace with your Redis / ElastiCache endpoint.
            value: "<REDIS_HOST>:6379"
        args:
          - "--failure-threshold=2"
          - "--healthcheck-interval=30"
      nodeSelector:
        role: game-servers
      serviceAccount: gamelift-daemonset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gamelift-daemonset
# Scoped to the verbs the daemon actually uses: it reads and patches nodes
# (cordon/taint), reads and patches pods (add tolerations), evicts pods, and
# lists Agones gameservers.
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["agones.dev"]
  resources: ["gameservers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gamelift-daemonset
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gamelift-daemonset
subjects:
- kind: ServiceAccount
  name: gamelift-daemonset
  namespace: kube-system